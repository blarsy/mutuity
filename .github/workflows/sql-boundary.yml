name: SQL Boundary

on:
  push:
  pull_request:

jobs:
  sql-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enforce SQL boundary
        run: node ./scripts/check-sql-boundary.mjs
