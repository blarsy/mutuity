name: Mobile Smoke Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration acceptance tests
        run: npx jest --no-coverage tests/integration/

      - name: Run E2E smoke tests
        run: npx jest --no-coverage tests/e2e/

      - name: Run typecheck
        run: npm run typecheck

      - name: Enforce GraphQL codegen drift
        run: git diff --exit-code -- src/services/graphql/schema.graphql src/services/graphql/generated.ts

      - name: Enforce UI contract gate
        run: npm run guard:ui-contract-gate