name: Mobile Typecheck

on:
  push:
  pull_request:

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate GraphQL schema snapshot and types
        run: npm run typecheck

      - name: Enforce GraphQL codegen drift
        run: git diff --exit-code -- src/services/graphql/schema.graphql src/services/graphql/generated.ts
