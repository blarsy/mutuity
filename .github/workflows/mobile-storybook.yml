name: Mobile Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      CI: "true"
      STORYBOOK_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle on-device Storybook for Android and iOS
        run: npm run storybook:build

      - name: Verify Storybook build output
        run: |
          test -s storybook-static/metadata.json
          test -n "$(find storybook-static/_expo/static/js/android -name '*.js' -size +0c -print -quit)"
          test -n "$(find storybook-static/_expo/static/js/ios -name '*.js' -size +0c -print -quit)"