name: Mobile Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npx storybook build --config-dir .storybook

      - name: Verify Storybook build output
        run: test -d storybook-static && test -f storybook-static/index.html